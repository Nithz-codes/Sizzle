server.port=8080

# Database Configuration (MySQL 8.x - Exclusive Database Provider)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sizzle?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Nithz0926}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configurations (Expiration: 24 Hours in milliseconds)
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

# Sizzle Intelligence Configuration (Backend AI Layer)
sizzle.intelligence.api-key=${AI_API_KEY:${GEMINI_API_KEY:${GOOGLE_API_KEY:}}}
sizzle.intelligence.model=${AI_MODEL:gemini-3.5-flash-lite}
sizzle.intelligence.timeout-ms=${AI_TIMEOUT_MS:30000}
